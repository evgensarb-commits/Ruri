name: Build RU-R1 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ru-r1-main-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RURI_SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      RURI_SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      RURI_SIGNING_ALIAS: ${{ secrets.KEY_ALIAS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Compile Kotlin before signing
        run: gradle --no-daemon clean :app:compileDebugKotlin

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Restore and verify permanent signing key
        run: |
          set -euo pipefail
          [ -n "$RURI_SIGNING_STORE_PASSWORD" ] || { echo "::error::KEYSTORE_PASSWORD secret is empty"; exit 1; }
          [ -n "$RURI_SIGNING_KEY_PASSWORD" ] || { echo "::error::KEY_PASSWORD secret is empty"; exit 1; }
          [ -n "$RURI_SIGNING_ALIAS" ] || { echo "::error::KEY_ALIAS secret is empty"; exit 1; }
          [ -s signing/ruri-signing.keystore.b64 ] || { echo "::error::Keystore base64 file is missing or empty"; exit 1; }
          if ! base64 --decode signing/ruri-signing.keystore.b64 > "$HOME/ruri.keystore"; then
            echo "::error::Could not decode the keystore file"
            exit 1
          fi
          if ! keytool -list -keystore "$HOME/ruri.keystore" -storepass "$RURI_SIGNING_STORE_PASSWORD" -alias "$RURI_SIGNING_ALIAS" > "$HOME/keystore-check.txt" 2>&1; then
            echo "::error::Keystore verification failed. Check KEYSTORE_PASSWORD and KEY_ALIAS against the stored keystore."
            cat "$HOME/keystore-check.txt"
            exit 1
          fi
          echo "Permanent RU-R1 signing keystore restored and alias verified."

      - name: Assemble signed APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          apksigner verify --verbose "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ru-r1-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
