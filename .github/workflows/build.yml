name: Build Ruri APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ruri-main-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'ruri-temporary-store' }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'ruri-temporary-key' }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'ruri' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$HOME/ruri.keystore"
          else
            echo "::warning::No persistent signing key is configured. This build uses a temporary keystore."
            keytool -genkey -v -keystore "$HOME/ruri.keystore" -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" -dname "CN=Ruri, OU=Ruri, O=Ruri, L=Ruri, S=Ruri, C=RU"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Compile and package APK
        run: gradle --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ruri-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
