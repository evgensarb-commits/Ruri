name: Build RU-R1 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ru-r1-main-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RURI_SIGNING_STORE_PASSWORD: ${{ secrets.RURI_SIGNING_STORE_PASSWORD }}
      RURI_SIGNING_KEY_PASSWORD: ${{ secrets.RURI_SIGNING_KEY_PASSWORD }}
      RURI_SIGNING_ALIAS: ${{ secrets.RURI_SIGNING_ALIAS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore permanent signing key
        env:
          RURI_SIGNING_KEYSTORE_BASE64: ${{ secrets.RURI_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$RURI_SIGNING_KEYSTORE_BASE64" || { echo "::error::Add RURI_SIGNING_KEYSTORE_BASE64 in GitHub Actions secrets."; exit 1; }
          test -n "$RURI_SIGNING_STORE_PASSWORD" || { echo "::error::Add RURI_SIGNING_STORE_PASSWORD in GitHub Actions secrets."; exit 1; }
          test -n "$RURI_SIGNING_KEY_PASSWORD" || { echo "::error::Add RURI_SIGNING_KEY_PASSWORD in GitHub Actions secrets."; exit 1; }
          test -n "$RURI_SIGNING_ALIAS" || { echo "::error::Add RURI_SIGNING_ALIAS in GitHub Actions secrets."; exit 1; }
          echo "$RURI_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$HOME/ruri.keystore"
          keytool -list -keystore "$HOME/ruri.keystore" -storepass "$RURI_SIGNING_STORE_PASSWORD" -alias "$RURI_SIGNING_ALIAS" > /dev/null

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Compile and package APK
        run: gradle --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ru-r1-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
