name: Build RU-R1 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ru-r1-main-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RURI_SIGNING_STORE_PASSWORD: ${{ secrets.RURI_SIGNING_STORE_PASSWORD || 'ru-r1-temporary-store' }}
      RURI_SIGNING_KEY_PASSWORD: ${{ secrets.RURI_SIGNING_KEY_PASSWORD || 'ru-r1-temporary-key' }}
      RURI_SIGNING_ALIAS: ${{ secrets.RURI_SIGNING_ALIAS || 'ru-r1-temporary' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore permanent signing key or create a test key
        env:
          RURI_SIGNING_KEYSTORE_BASE64: ${{ secrets.RURI_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$RURI_SIGNING_KEYSTORE_BASE64" ] &&
             printf '%s' "$RURI_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$HOME/ruri.keystore.tmp" 2>/dev/null &&
             keytool -list -keystore "$HOME/ruri.keystore.tmp" -storepass "$RURI_SIGNING_STORE_PASSWORD" -alias "$RURI_SIGNING_ALIAS" > /dev/null 2>&1; then
            mv "$HOME/ruri.keystore.tmp" "$HOME/ruri.keystore"
            echo "Using the configured permanent signing key."
          else
            rm -f "$HOME/ruri.keystore.tmp"
            echo "::warning::No valid permanent keystore secret found. Using a temporary test key for this APK."
            keytool -genkey -v -keystore "$HOME/ruri.keystore" -alias "$RURI_SIGNING_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -storepass "$RURI_SIGNING_STORE_PASSWORD" -keypass "$RURI_SIGNING_KEY_PASSWORD" -dname "CN=RU-R1, OU=RU-R1, O=RU-R1, L=RU-R1, S=RU"
          fi
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Compile and package APK
        run: gradle --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ru-r1-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
