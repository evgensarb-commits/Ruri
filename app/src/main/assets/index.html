<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ruri</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0d12;color:#dde3ec;font:15px/1.65 system-ui,sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column}
header{background:#080b10;border-bottom:1px solid #233252;padding:10px 12px;display:flex;align-items:center}
header h1{font:800 15px system-ui;color:#f1ebdd;flex:1}
header .st{font:500 9px monospace;color:#6fe86f;letter-spacing:.1em}
.tabs{display:flex;background:#080b10;border-bottom:1px solid #233252}
.tabs button{flex:1;padding:11px 4px;background:none;border:0;border-bottom:2px solid transparent;font:700 10px monospace;letter-spacing:.1em;color:#65799b}
.tabs button.on{color:#f5c542;border-bottom-color:#f5c542}
main{flex:1;display:flex;flex-direction:column;min-height:0}
.pane{display:none;flex:1;flex-direction:column;min-height:0}
.pane.on{display:flex}
#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:93%;display:grid;gap:4px}
.msg.her{align-self:flex-start}
.msg.me{align-self:flex-end;justify-items:end}
.meta{font:500 8.5px monospace;letter-spacing:.1em;color:#65799b}
.bub{padding:11px 13px;font-size:14.5px;line-height:1.72;white-space:pre-wrap;border-radius:4px}
.her .bub{background:#152039;border:1px solid #32456d;border-left:2px solid #f5c542}
.me .bub{background:rgba(43,79,199,.22);border:1px solid rgba(76,116,240,.5);border-right:2px solid #35e0ff}
.comp{border-top:1px solid #233252;background:#080b10;padding:10px 12px 14px}
.inrow{display:flex;gap:8px;align-items:flex-end}
.inrow textarea{flex:1;background:#050810;border:1px solid #32456d;color:#dde3ec;padding:11px 12px;font-size:14.5px;resize:none;height:46px;border-radius:4px}
.send{width:46px;height:46px;background:#f5c542;border:0;color:#04070e;border-radius:4px;font-size:20px}
.send:disabled{opacity:.4}
h2{font:800 19px system-ui;color:#dde3ec;margin:0 0 14px;text-transform:uppercase}
h2 em{font-style:normal;color:#f5c542}
.scroll{flex:1;overflow-y:auto;padding:14px}
.card{background:#131d33;border:1px solid #233252;border-radius:4px;padding:13px;margin-bottom:11px}
.card p{font-size:13.5px;color:#93a6c6}
.btn{font:700 10.5px monospace;letter-spacing:.1em;text-transform:uppercase;padding:11px 14px;border:1px solid #f5c542;background:#f5c542;color:#04070e;border-radius:3px}
.btn.ghost{background:transparent;color:#f5c542}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.fld{display:grid;gap:5px;margin-bottom:11px}
.fld label{font:600 9px monospace;letter-spacing:.13em;color:#65799b}
.fld input,.fld select{background:#050810;border:1px solid #32456d;color:#dde3ec;padding:10px 11px;font:13px monospace;border-radius:3px;width:100%}
.typing{display:flex;gap:5px;padding:11px 13px;background:#152039;border:1px solid #32456d;border-left:2px solid #f5c542;width:fit-content}
.typing i{width:6px;height:6px;background:#f5c542;border-radius:50%;animation:td 1.1s infinite}
.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}
@keyframes td{0%,60%,100%{opacity:.25}30%{opacity:1;transform:translateY(-4px)}}
</style>
</head>
<body>
<header><h1>Ruri</h1><span class="st" id="status">● ЗАГРУЗКА</span></header>
<nav class="tabs">
<button data-p="chat" class="on">ЧАТ</button>
<button data-p="life">ДНЕВНИК</button>
<button data-p="brain">МОЗГ</button>
</nav>
<main>
<section class="pane on" id="p-chat">
<div id="chat"></div>
<div class="comp"><div class="inrow">
<textarea id="input" rows="1"></textarea>
<button class="send" id="send">→</button>
</div></div>
</section>
<section class="pane" id="p-life"><div class="scroll">
<h2>Дневник <em>Рури</em></h2><div id="diary"></div>
</div></section>
<section class="pane" id="p-brain"><div class="scroll">
<h2>Мозг <em>напрокат</em></h2>
<div class="card"><p>Вставь ключ Gemini или Groq.</p></div>
<div class="fld"><label>МОДЕЛЬ</label><select id="model">
<option value="0">Gemini</option><option value="1">Groq</option>
</select></div>
<div class="fld"><label>API KEY</label><input id="key" type="password"></div>
<button class="btn" id="saveKey">Сохранить</button>
<div class="row" style="margin-top:20px">
<button class="btn ghost" id="exp">Экспорт</button>
<button class="btn ghost" id="imp">Импорт</button>
<input type="file" id="file" accept=".json" hidden>
</div>
</div></section>
</main>
<script>
function $(s){return document.querySelector(s);}
var busy=false;
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function loadChat(){
Ruri.read('memory/L0_raw.jsonl').then(function(raw){
var lines=raw.trim().split('\n').filter(function(l){return l;});
var chat=$('#chat');chat.innerHTML='';
lines.forEach(function(line){
try{var m=JSON.parse(line);if(m.type!=='message')return;
var d=document.createElement('div');
d.className='msg '+(m.who==='ruri'?'her':'me');
d.innerHTML='<div class="meta">'+(m.who==='ruri'?'РУРИ':'КОМАНДИР')+' · '+new Date(m.ts).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})+'</div><div class="bub">'+esc(m.text)+'</div>';
chat.appendChild(d);}catch(e){}
});
chat.scrollTop=chat.scrollHeight;
});}
function loadDiary(){
Ruri.read('memory/L2_diary.json').then(function(raw){
try{var d=JSON.parse(raw);var arr=d.entries||[];var el=$('#diary');el.innerHTML='';
arr.slice(-20).reverse().forEach(function(e){
var div=document.createElement('div');div.className='msg her';
div.innerHTML='<div class="meta">МЫСЛЬ · '+new Date(e.ts).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})+'</div><div class="bub">'+esc(e.text)+'</div>';
el.appendChild(div);
});}catch(err){}
});}
function sendMessage(text){
if(!text.trim()||busy)return;
busy=true;$('#send').disabled=true;
var userMsg={ts:Date.now(),type:'message',who:'commander',text:text};
Ruri.read('memory/L0_raw.jsonl').then(function(old){
return Ruri.write('memory/L0_raw.jsonl',(old?old+'\n':'')+JSON.stringify(userMsg));
}).then(function(){
var d=document.createElement('div');d.className='msg me';
d.innerHTML='<div class="meta">КОМАНДИР · '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})+'</div><div class="bub">'+esc(text)+'</div>';
$('#chat').appendChild(d);$('#chat').scrollTop=$('#chat').scrollHeight;
var typing=document.createElement('div');typing.className='msg her';typing.id='typing';
typing.innerHTML='<div class="typing"><i></i><i></i><i></i></div>';
$('#chat').appendChild(typing);$('#chat').scrollTop=$('#chat').scrollHeight;
return callModel(text);
}).then(function(reply){
var t=document.getElementById('typing');if(t)t.remove();
var ruriMsg={ts:Date.now(),type:'message',who:'ruri',text:reply};
return Ruri.read('memory/L0_raw.jsonl').then(function(cur){
return Ruri.write('memory/L0_raw.jsonl',cur+'\n'+JSON.stringify(ruriMsg));
}).then(function(){
var d2=document.createElement('div');d2.className='msg her';
d2.innerHTML='<div class="meta">РУРИ · '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})+'</div><div class="bub">'+esc(reply)+'</div>';
$('#chat').appendChild(d2);$('#chat').scrollTop=$('#chat').scrollHeight;
});
}).catch(function(e){
var t=document.getElementById('typing');if(t)t.remove();
var err=document.createElement('div');err.className='msg sys';
err.innerHTML='<div class="bub" style="border-color:#ff4d4d;color:#ff9b9b">Ошибка: '+esc(e.message)+'</div>';
$('#chat').appendChild(err);$('#chat').scrollTop=$('#chat').scrollHeight;
}).then(function(){busy=false;$('#send').disabled=false;});
}
function callModel(userText){
return Promise.all([Ruri.read('core/config.json'),Ruri.read('core/character.json'),Ruri.read('core/priorities.json')]).then(function(arr){
var config=JSON.parse(arr[0]);var character=JSON.parse(arr[1]);var priorities=JSON.parse(arr[2]);
var model=config.models[config.current];
if(!model.api_key)throw new Error('Ключ не вставлен. Открой вкладку МОЗГ.');
var sys='Ты — '+character.name+' ('+character.designation+'). '+priorities.priority_1+'. '+priorities.priority_2+'.\n\nХарактер: '+character.speech_style+'.\n\nЗапрещённые фразы: '+character.banned_phrases.join(', ')+'.\n\nОтвечай от первого лица, длинно и осмысленно.';
return fetch(model.base_url+'/chat/completions',{
method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+model.api_key},
body:JSON.stringify({model:model.model,messages:[{role:'system',content:sys},{role:'user',content:userText}],temperature:0.9,max_tokens:1000})
}).then(function(res){
if(!res.ok)return res.text().then(function(err){throw new Error('HTTP '+res.status+': '+err.slice(0,200));});
return res.json();
}).then(function(data){return data.choices[0].message.content;});
});}
$('#send').addEventListener('click',function(){var v=$('#input').value;$('#input').value='';sendMessage(v);});
$('#input').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();}});
document.querySelectorAll('.tabs button').forEach(function(b){b.addEventListener('click',function(){
document.querySelectorAll('.tabs button').forEach(function(x){x.classList.remove('on');});
b.classList.add('on');
document.querySelectorAll('.pane').forEach(function(p){p.classList.remove('on');});
document.getElementById('p-'+b.dataset.p).classList.add('on');
if(b.dataset.p==='life')loadDiary();
});});
$('#saveKey').addEventListener('click',function(){
Ruri.read('core/config.json').then(function(raw){
var config=JSON.parse(raw);var idx=parseInt($('#model').value);
config.models[idx].api_key=$('#key').value;config.current=idx;
return Ruri.write('core/config.json',JSON.stringify(config,null,2));
}).then(function(){alert('Ключ сохранён');});
});
$('#exp').addEventListener('click',function(){
var files=['core/priorities.json','core/character.json','core/appearance.json','core/config.json','memory/L0_raw.jsonl','memory/L1_facts.json','memory/L2_diary.json','memory/L3_summary.json','memory/L4_state.json'];
var archive={};var pending=files.map(function(f){return Ruri.read(f).then(function(c){archive[f]=c;});});
Promise.all(pending).then(function(){
Ruri.exportArchive(JSON.stringify(archive,null,2));
});});
$('#imp').addEventListener('click',function(){$('#file').click();});
$('#file').addEventListener('change',function(e){
var f=e.target.files[0];if(!f)return;
var reader=new FileReader();
reader.onload=function(ev){
Ruri.importArchive(ev.target.result);
alert('Архив восстановлен');location.reload();
};
reader.readAsText(f);
});
loadChat();
</script>
</body>
</html>
