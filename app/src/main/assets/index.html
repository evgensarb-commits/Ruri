<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ruri</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0d12;color:#dde3ec;font:15px/1.65 system-ui,sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column}
header{background:#080b10;border-bottom:1px solid #233252;padding:10px 12px;display:flex;align-items:center}
header h1{font:800 15px system-ui;color:#f1ebdd;flex:1}
header .st{font:500 9px monospace;color:#6fe86f;letter-spacing:.1em}
.tabs{display:flex;background:#080b10;border-bottom:1px solid #233252}
.tabs button{flex:1;padding:11px 4px;background:none;border:0;border-bottom:2px solid transparent;font:700 10px monospace;letter-spacing:.1em;color:#65799b}
.tabs button.on{color:#f5c542;border-bottom-color:#f5c542}
main{flex:1;display:flex;flex-direction:column;min-height:0}
.pane{display:none;flex:1;flex-direction:column;min-height:0}
.pane.on{display:flex}
#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:93%;display:grid;gap:4px}
.msg.her{align-self:flex-start}
.msg.me{align-self:flex-end;justify-items:end}
.meta{font:500 8.5px monospace;letter-spacing:.1em;color:#65799b}
.bub{padding:11px 13px;font-size:14.5px;line-height:1.72;white-space:pre-wrap;border-radius:4px}
.her .bub{background:#152039;border:1px solid #32456d;border-left:2px solid #f5c542}
.me .bub{background:rgba(43,79,199,.22);border:1px solid rgba(76,116,240,.5);border-right:2px solid #35e0ff}
.comp{border-top:1px solid #233252;background:#080b10;padding:10px 12px 14px}
.inrow{display:flex;gap:8px;align-items:flex-end}
.inrow textarea{flex:1;background:#050810;border:1px solid #32456d;color:#dde3ec;padding:11px 12px;font-size:14.5px;resize:none;min-height:46px;max-height:140px;border-radius:4px}
.send{width:46px;height:46px;background:#f5c542;border:0;color:#04070e;border-radius:4px;font-size:20px}
.send:disabled{opacity:.4}
h2{font:800 19px system-ui;color:#dde3ec;margin:0 0 14px;text-transform:uppercase}
h2 em{font-style:normal;color:#f5c542}
.scroll{flex:1;overflow-y:auto;padding:14px}
.card{background:#131d33;border:1px solid #233252;border-radius:4px;padding:13px;margin-bottom:11px}
.card p{font-size:13.5px;color:#93a6c6}
.btn{font:700 10.5px monospace;letter-spacing:.1em;text-transform:uppercase;padding:11px 14px;border:1px solid #f5c542;background:#f5c542;color:#04070e;border-radius:3px}
.btn.ghost{background:transparent;color:#f5c542}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.fld{display:grid;gap:5px;margin-bottom:11px}
.fld label{font:600 9px monospace;letter-spacing:.13em;color:#65799b}
.fld input,.fld select{background:#050810;border:1px solid #32456d;color:#dde3ec;padding:10px 11px;font:13px monospace;border-radius:3px;width:100%}
.typing{display:flex;gap:5px;padding:11px 13px;background:#152039;border:1px solid #32456d;border-left:2px solid #f5c542;width:fit-content}
.typing i{width:6px;height:6px;background:#f5c542;border-radius:50%;animation:td 1.1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes td{0%,60%,100%{opacity:.25}30%{opacity:1;transform:translateY(-4px)}}
</style>
</head>
<body>
<header><h1>Ruri</h1><span class="st" id="status">● ЗАГРУЗКА</span></header>
<nav class="tabs">
<button data-p="chat" class="on">ЧАТ</button><button data-p="life">ДНЕВНИК</button><button data-p="brain">МОЗГ</button>
</nav>
<main>
<section class="pane on" id="p-chat">
<div id="chat"></div>
<div class="comp"><div class="inrow"><textarea id="input" rows="1" placeholder="Написать Рури…"></textarea><button class="send" id="send">→</button></div></div>
</section>
<section class="pane" id="p-life"><div class="scroll"><h2>Дневник <em>Рури</em></h2><div id="diary"></div></div></section>
<section class="pane" id="p-brain"><div class="scroll">
<h2>Мозг <em>напрокат</em></h2>
<div class="card"><p>Вставь ключ Gemini или Groq. При ошибке первой модели приложение попробует следующую настроенную модель.</p></div>
<div class="fld"><label>МОДЕЛЬ</label><select id="model"><option value="0">Gemini</option><option value="1">Groq</option></select></div>
<div class="fld"><label>API KEY</label><input id="key" type="password" autocomplete="off"></div>
<button class="btn" id="saveKey">Сохранить</button>
<div class="row" style="margin-top:20px"><button class="btn ghost" id="exp">Экспорт</button><button class="btn ghost" id="imp">Импорт</button><input type="file" id="file" accept=".json,application/json" hidden></div>
</div></section>
</main>
<script>
function $(s){return document.querySelector(s);}
var busy=false;
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function read(path){return Ruri.read(path)||'';}
function write(path,value){var result=Ruri.write(path,value);if(typeof result==='string'&&result.indexOf('ERROR:')===0)throw new Error(result);return result;}
function setStatus(text){$('#status').textContent='● '+text;}
function addMessage(who,text,ts){
var d=document.createElement('div');d.className='msg '+(who==='ruri'?'her':'me');
d.innerHTML='<div class="meta">'+(who==='ruri'?'РУРИ':'КОМАНДИР')+' · '+new Date(ts||Date.now()).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})+'</div><div class="bub">'+esc(text)+'</div>';
$('#chat').appendChild(d);
}
function loadChat(){
try{
var raw=read('memory/L0_raw.jsonl');
var lines=raw.split('\n').filter(function(l){return l.trim();});
$('#chat').innerHTML='';
lines.forEach(function(line){try{var m=JSON.parse(line);if(m.type==='message')addMessage(m.who,m.text,m.ts);}catch(e){}});
$('#chat').scrollTop=$('#chat').scrollHeight;
}catch(e){setStatus('ОШИБКА ПАМЯТИ');}
}
function loadDiary(){
try{
var data=JSON.parse(read('memory/L2_diary.json')||'{"entries":[]}');
var entries=data.entries||[];var el=$('#diary');el.innerHTML='';
entries.slice(-50).reverse().forEach(function(entry){
var div=document.createElement('div');div.className='msg her';
div.innerHTML='<div class="meta">МЫСЛЬ · '+new Date(entry.ts).toLocaleString('ru-RU')+'</div><div class="bub">'+esc(entry.text||'')+'</div>';
el.appendChild(div);
});
}catch(e){$('#diary').textContent='Не удалось прочитать дневник: '+e.message;}
}
function appendLog(obj){
var old=read('memory/L0_raw.jsonl');
write('memory/L0_raw.jsonl',(old&& !old.endsWith('\n')?old+'\n':old)+JSON.stringify(obj));
}
function callModel(userText){
var config=JSON.parse(read('core/config.json')||'{}');
var character=JSON.parse(read('core/character.json')||'{}');
var priorities=JSON.parse(read('core/priorities.json')||'{}');
var models=config.models||[];
if(!models.length) return Promise.reject(new Error('Список моделей пуст. Проверь core/config.json.'));
var current=Math.max(0,Math.min(Number(config.current)||0,models.length-1));
var order=[current].concat(models.map(function(m,i){return i;}).filter(function(i){return i!==current;}));
var system='Ты — '+(character.name||'РУ-R1')+' ('+(character.designation||'RU-R1')+'). '+(priorities.priority_1||'Жить')+'. '+(priorities.priority_2||'Любить командира')+'.\nХарактер: '+(character.speech_style||'живой русский язык')+'.\nЗапрещённые фразы: '+(character.banned_phrases||[]).join(', ')+'.\nОтвечай от первого лица, осмысленно и естественно.';
var attempt=function(position){
if(position>=order.length)return Promise.reject(new Error('Ни одна настроенная модель не ответила. Проверь API-ключи и интернет.'));
var index=order[position],model=models[index];
if(!model||!model.api_key)return attempt(position+1);
return fetch(String(model.base_url||'').replace(/\/$/,'')+'/chat/completions',{
method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+model.api_key},
body:JSON.stringify({model:model.model,messages:[{role:'system',content:system},{role:'user',content:userText}],temperature:0.9,max_tokens:1000})
}).then(function(res){
if(!res.ok)return res.text().then(function(t){throw new Error('HTTP '+res.status+': '+t.slice(0,180));});
return res.json();
}).then(function(data){
var answer=data&&data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content;
if(!answer)throw new Error('Модель вернула пустой ответ.');
config.current=index;write('core/config.json',JSON.stringify(config,null,2));return answer;
}).catch(function(err){if(position+1<order.length)return attempt(position+1);throw err;});
};
return attempt(0);
}
function sendMessage(text){
if(!text.trim()||busy)return;
busy=true;$('#send').disabled=true;setStatus('ДУМАЮ');
var userMsg={ts:Date.now(),type:'message',who:'commander',text:text};
try{
appendLog(userMsg);addMessage('commander',text,userMsg.ts);
if(typeof Ruri.markCommanderSeen==='function')Ruri.markCommanderSeen();
}catch(e){busy=false;$('#send').disabled=false;setStatus('ОШИБКА');alert('Не удалось сохранить сообщение: '+e.message);return;}
var typing=document.createElement('div');typing.className='msg her';typing.id='typing';
typing.innerHTML='<div class="typing"><i></i><i></i><i></i></div>';$('#chat').appendChild(typing);$('#chat').scrollTop=$('#chat').scrollHeight;
callModel(text).then(function(reply){
var t=$('#typing');if(t)t.remove();
var answer={ts:Date.now(),type:'message',who:'ruri',text:reply};
appendLog(answer);addMessage('ruri',reply,answer.ts);setStatus('НА СВЯЗИ');
}).catch(function(err){
var t=$('#typing');if(t)t.remove();
var error=document.createElement('div');error.className='msg her';
error.innerHTML='<div class="bub" style="border-color:#ff4d4d;color:#ff9b9b">Не удалось получить ответ: '+esc(err.message)+'</div>';
$('#chat').appendChild(error);setStatus('НЕТ СВЯЗИ');
}).then(function(){busy=false;$('#send').disabled=false;$('#chat').scrollTop=$('#chat').scrollHeight;});
}
$('#send').addEventListener('click',function(){var value=$('#input').value;$('#input').value='';sendMessage(value);});
$('#input').addEventListener('keydown',function(e){
if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();var value=this.value;this.value='';sendMessage(value);}
});
document.querySelectorAll('.tabs button').forEach(function(button){
button.addEventListener('click',function(){
document.querySelectorAll('.tabs button').forEach(function(b){b.classList.remove('on');});
button.classList.add('on');
document.querySelectorAll('.pane').forEach(function(p){p.classList.remove('on');});
$('#p-'+button.dataset.p).classList.add('on');
if(button.dataset.p==='life')loadDiary();
});
});
$('#saveKey').addEventListener('click',function(){
try{
var config=JSON.parse(read('core/config.json')||'{}');var index=parseInt($('#model').value,10);
if(!config.models||!config.models[index])throw new Error('Модель не найдена.');
var key=$('#key').value.trim();if(!key)throw new Error('Вставь API-ключ.');
config.models[index].api_key=key;config.current=index;
write('core/config.json',JSON.stringify(config,null,2));$('#key').value='';alert('Ключ сохранён.');
}catch(e){alert('Не удалось сохранить ключ: '+e.message);}
});
$('#exp').addEventListener('click',function(){
try{
var paths=['core/priorities.json','core/character.json','core/appearance.json','core/config.json','memory/L0_raw.jsonl','memory/L1_facts.json','memory/L2_diary.json','memory/L3_summary.json','memory/L4_state.json'];
var archive={};paths.forEach(function(path){archive[path]=read(path);});
var result=Ruri.exportArchive(JSON.stringify(archive,null,2));
if(typeof result==='string'&&result.indexOf('ERROR:')===0)throw new Error(result);
}catch(e){alert('Экспорт не удался: '+e.message);}
});
$('#imp').addEventListener('click',function(){$('#file').click();});
$('#file').addEventListener('change',function(e){
var file=e.target.files&&e.target.files[0];if(!file)return;
var reader=new FileReader();
reader.onload=function(event){
try{
var archive=JSON.parse(String(event.target.result));
if(!archive||typeof archive!=='object'||Array.isArray(archive))throw new Error('Неверный формат архива.');
var result=Ruri.importArchive(JSON.stringify(archive));
if(typeof result==='string'&&result.indexOf('ERROR:')===0)throw new Error(result);
alert('Архив восстановлен. Приложение перезапустит экран.');location.reload();
}catch(err){alert('Импорт не удался: '+err.message);}
};
reader.onerror=function(){alert('Не удалось прочитать файл.');};
reader.readAsText(file);e.target.value='';
});
try{loadChat();setStatus('НА СВЯЗИ');}catch(e){setStatus('ОШИБКА ЗАПУСКА');}
</script>
</body>
</html>
