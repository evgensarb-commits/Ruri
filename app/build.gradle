plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ruri'
    compileSdk 35

    defaultConfig {
        applicationId "com.ruri"
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName "1.5"
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("HOME") + "/ruri.keystore")
            storeType "PKCS12"
            storePassword System.getenv("RURI_SIGNING_STORE_PASSWORD")
            keyAlias System.getenv("RURI_SIGNING_ALIAS")
            keyPassword System.getenv("RURI_SIGNING_KEY_PASSWORD")
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.work:work-runtime:2.12.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
